name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming (feat/ or fix/ only)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ($env:HEAD_REF -notmatch '^(feat|fix)/[a-z0-9-]+$') {
            Write-Error "Invalid branch name '$env:HEAD_REF'. Only 'feat/<slug>' and 'fix/<slug>' branches are allowed."
            exit 1
          }
          Write-Host "[OK] Valid branch name: $env:HEAD_REF"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate recipes
        shell: pwsh
        run: ./.agents/skills/add-recipe/scripts/validate-recipes.ps1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
