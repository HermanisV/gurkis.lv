name: "✨ Lapas uzlabojums"
description: "Ierosini jaunu funkciju, dizaina uzlabojumu vai izmaiņas Gurķis LV lapai"
title: "[Lapas uzlabojums] "
labels: ["pieprasijums", "lapas-uzlabojums"]
body:
  - type: dropdown
    id: request_type
    attributes:
      label: "Pieprasījuma veids"
      options:
        - "Jauna lapas funkcija vai dizaina uzlabojums"
        - "Kļūdas labojums"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Ko vēlies mainīt vai pievienot?"
      description: "Apraksti vēlamos uzlabojumus — AI aģents tos izlasīs, ieviesīs un aizvērs šo pieprasījumu."
      placeholder: "Apraksti savu ideju vai labojumu..."
    validations:
      required: true
