<!DOCTYPE html>
<html lang="{{ site.lang | default: 'lv' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.subtitle }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="brand-icon" aria-hidden="true">🥒</span>
        <div class="brand-text">
          <span class="brand-title">{{ site.title }}</span>
          <span class="brand-subtitle">Recepšu katalogs (g / ml / °C)</span>
        </div>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Visas receptes ({{ site.recipes | size }})</a>
      </nav>
    </div>
  </header>

  <main class="site-main container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ "now" | date: "%Y" }} <strong>{{ site.title }}</strong> · Visi mērījumi gramos (g) un mililitros (ml).</p>
    </div>
  </footer>

  <script>
    window.GURKIS_CONFIG = {
      searchUrl: "{{ '/search.json' | relative_url }}?v={{ site.time | date: '%s' }}"
    };
  </script>
  <script src="{{ '/assets/js/search.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
